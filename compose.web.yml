# Add to the existing Compose project; preserve its database and volumes.
# NEXT_PUBLIC_API_URL is a browser URL, embedded at build time.
services:
  hospital-web:
    build:
      context: .
      dockerfile: Dockerfile.web
      args:
        WEB_APP: hospital-web
        NEXT_PUBLIC_API_URL: ${PUBLIC_API_URL:?Set PUBLIC_API_URL to the HTTPS API origin}
    restart: unless-stopped
    ports:
      - '127.0.0.1:3000:3000'
    mem_limit: 512m
  blood-center-web:
    build:
      context: .
      dockerfile: Dockerfile.web
      args:
        WEB_APP: blood-center-web
        NEXT_PUBLIC_API_URL: ${PUBLIC_API_URL:?Set PUBLIC_API_URL to the HTTPS API origin}
    restart: unless-stopped
    ports:
      - '127.0.0.1:3002:3000'
    mem_limit: 512m
  admin-web:
    build:
      context: .
      dockerfile: Dockerfile.web
      args:
        WEB_APP: admin-web
        NEXT_PUBLIC_API_URL: ${PUBLIC_API_URL:?Set PUBLIC_API_URL to the HTTPS API origin}
    restart: unless-stopped
    ports:
      - '127.0.0.1:3003:3000'
    mem_limit: 512m

  landing-web:
    build:
      context: .
      dockerfile: Dockerfile.web
      args:
        WEB_APP: landing-web
        NEXT_PUBLIC_API_URL: ${PUBLIC_API_URL:?Set PUBLIC_API_URL to the HTTPS API origin}
    restart: unless-stopped
    ports:
      - '127.0.0.1:3004:3000'
    mem_limit: 512m

  donor-web:
    build:
      context: .
      dockerfile: Dockerfile.web
      args:
        WEB_APP: donor-web
        NEXT_PUBLIC_API_URL: ${PUBLIC_API_URL:?Set PUBLIC_API_URL to the HTTPS API origin}
    environment:
      API_UPSTREAM_URL: http://api:3001
      DONOR_ORIGIN: ${DONOR_ORIGIN:-https://donor.bloodchain.uz}
    restart: unless-stopped
    ports:
      - '127.0.0.1:3005:3000'
    mem_limit: 512m
