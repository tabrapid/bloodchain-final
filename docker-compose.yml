services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-donor}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-donor}
      POSTGRES_DB: ${POSTGRES_DB:-donor}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - '${POSTGRES_PORT:-5432}:5432'
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${POSTGRES_USER:-donor} -d ${POSTGRES_DB:-donor}']
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      NODE_ENV: production
      PORT: 3001
      DATABASE_URL: postgresql://${POSTGRES_USER:-donor}:${POSTGRES_PASSWORD:-donor}@postgres:5432/${POSTGRES_DB:-donor}
      JWT_ACCESS_SECRET: ${JWT_ACCESS_SECRET:?Set JWT_ACCESS_SECRET in .env (min 32 chars)}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET:?Set JWT_REFRESH_SECRET in .env (min 32 chars)}
      JWT_ACCESS_EXPIRES_IN: ${JWT_ACCESS_EXPIRES_IN:-15m}
      API_URL: ${API_URL:-http://localhost:3001}
      WEB_URL: ${WEB_URL:-http://localhost:3000,http://localhost:3002,http://localhost:3003}
      MOBILE_DEEP_LINK: ${MOBILE_DEEP_LINK:-donor://}
      THROTTLER_TTL: ${THROTTLER_TTL:-60}
      THROTTLER_LIMIT: ${THROTTLER_LIMIT:-100}
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_SECURE: ${SMTP_SECURE:-false}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      SMTP_FROM: ${SMTP_FROM:-BloodChain <no-reply@donor.local>}
      EMAIL_VERIFICATION_TTL_HOURS: ${EMAIL_VERIFICATION_TTL_HOURS:-24}
      DONATION_COOLDOWN_DAYS: ${DONATION_COOLDOWN_DAYS:-56}
      EXPO_ACCESS_TOKEN: ${EXPO_ACCESS_TOKEN:-}
      AI_ENABLED: ${AI_ENABLED:-false}
      AI_API_KEY: ${AI_API_KEY:-}
      AI_MODEL: ${AI_MODEL:-gpt-4o-mini}
      AI_BASE_URL: ${AI_BASE_URL:-https://api.openai.com/v1}
      AI_MAX_TOKENS: ${AI_MAX_TOKENS:-1000}
      AI_TIMEOUT_MS: ${AI_TIMEOUT_MS:-30000}
    ports:
      - '${API_PORT:-3001}:3001'
    healthcheck:
      test: ['CMD', 'node', '-e', "require('http').get('http://localhost:3001/api/v1/health', r => process.exit(r.statusCode === 200 ? 0 : 1)).on('error', () => process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 15s

  # Development only. Gated behind a Compose profile, so `docker compose up`
  # never starts it and a production deployment cannot acquire it by accident:
  # it runs only for `docker compose --profile dev up -d mailpit`.
  #
  # A mail catcher accepts every message and delivers none, which is what makes
  # the reset link readable during a demo. It listens on the same SMTP port as
  # `pnpm mail:dev`, so the API is configured the same way either way; the
  # difference is that this one has a browsable inbox at http://localhost:8025.
  mailpit:
    image: axllent/mailpit:latest
    profiles: ['dev']
    restart: unless-stopped
    ports:
      - '${MAILPIT_SMTP_PORT:-1025}:1025'
      - '${MAILPIT_UI_PORT:-8025}:8025'
    environment:
      MP_MAX_MESSAGES: 500
      MP_SMTP_AUTH_ACCEPT_ANY: 1
      MP_SMTP_AUTH_ALLOW_INSECURE: 1

volumes:
  postgres_data:
