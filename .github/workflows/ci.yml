name: CI

# Which branches CI actually guards.
#
# This used to be `main` alone, and for 110 green runs that looked fine. It was
# not: every one of those runs was against a commit on `main`, and all of
# Sprints 0-7 -- the eligibility gates, the clinical release lock, the deferral
# domain, the verification isolation -- lives on `claude/local-test-ready`,
# which CI had never seen. The pipeline was green because it was looking at the
# wrong branch, which is the most expensive kind of green there is.
#
# `claude/local-test-ready` is the canonical development branch. `main` stays
# listed so it keeps its guard when the sprint line is eventually merged down.
on:
  push:
    branches: [claude/local-test-ready, main]
  pull_request:
    branches: [claude/local-test-ready, main]
  workflow_dispatch: {}

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: '22'
  # Named so the seed's own guard recognises it as disposable.
  #
  # `prisma/seed.ts` TRUNCATEs every table it owns, so it refuses to run unless
  # the database is on a loopback host AND its name identifies it as a
  # development database. The previous name here was `donor_e2e`, which matches
  # none of dev/development/test/demo/local/sandbox/scratch -- so the seed step
  # refused, and the whole e2e job would have failed the first time CI ran
  # against a branch that carries the guard. It never did, because CI only
  # watched `main`, where the guard does not exist yet.
  CI_DATABASE: bloodchain_ci_test
  CI_DATABASE_URL: postgresql://donor:donor@localhost:5432/bloodchain_ci_test
  # Test-only. Long enough for the schema, and obviously not a real secret.
  CI_JWT_ACCESS_SECRET: ci-only-access-secret-at-least-32-characters-long
  CI_JWT_REFRESH_SECRET: ci-only-refresh-secret-at-least-32-characters-long

jobs:
  lint-and-typecheck:
    name: Lint & typecheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Generate Prisma client
        run: pnpm --filter @bloodchain/api prisma:generate
      - run: pnpm typecheck
      - run: pnpm lint

  test:
    name: Unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Generate Prisma client
        run: pnpm --filter @bloodchain/api prisma:generate
      - run: pnpm test

  test-e2e:
    name: API e2e tests (real database)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: donor
          POSTGRES_PASSWORD: donor
          POSTGRES_DB: bloodchain_ci_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U donor -d bloodchain_ci_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://donor:donor@localhost:5432/bloodchain_ci_test
      JWT_ACCESS_SECRET: ci-only-access-secret-at-least-32-characters-long
      JWT_REFRESH_SECRET: ci-only-refresh-secret-at-least-32-characters-long
      NODE_ENV: test
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Generate Prisma client
        run: pnpm --filter @bloodchain/api prisma:generate
      - name: Apply migrations
        run: pnpm --filter @bloodchain/api exec prisma migrate deploy
      - name: Seed database (the app needs its roles and permissions to exist at all)
        run: pnpm --filter @bloodchain/api prisma:seed
      - run: pnpm --filter @bloodchain/api test:e2e

  verification-scripts:
    # The gates that need a running API, which is why they were never in CI.
    #
    # Until Sprint 7 they could not have run here anyway: they drove their flows
    # through one shared demo donor and completed real donations with it, so the
    # second script to run found that donor inside a 56-day recovery window and
    # failed on the rule the first had just proved. They own their data now, so
    # the sequence below -- safety, demo, safety, demo, with NO reset between
    # them -- is the contract Sprint 7 established, asserted on every push.
    name: Verification scripts (running API)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: donor
          POSTGRES_PASSWORD: donor
          POSTGRES_DB: bloodchain_ci_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U donor -d bloodchain_ci_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://donor:donor@localhost:5432/bloodchain_ci_test
      JWT_ACCESS_SECRET: ci-only-access-secret-at-least-32-characters-long
      JWT_REFRESH_SECRET: ci-only-refresh-secret-at-least-32-characters-long
      # Not production: these scripts drive the development SMS adapter and the
      # development clinical release policy, both of which the API refuses to
      # run in production by design.
      NODE_ENV: development
      PORT: '3001'
      # Two names, because the scripts grew at different times: the Sprint 0
      # and demo scripts read DEMO_API_URL, the geography and boolean verifiers
      # read VERIFY_API_URL. Both are set rather than relying on the shared
      # default, so moving the API off 3001 here does not silently point half
      # the suite at nothing.
      DEMO_API_URL: http://localhost:3001
      VERIFY_API_URL: http://localhost:3001
      WEB_URL: http://localhost:3000,http://localhost:3002,http://localhost:3003
      SMS_PROVIDER: console
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Generate Prisma client
        run: pnpm --filter @bloodchain/api prisma:generate
      - name: Apply migrations
        run: pnpm --filter @bloodchain/api exec prisma migrate deploy
      - name: Seed database
        run: pnpm --filter @bloodchain/api prisma:seed
      - name: Build API
        run: pnpm --filter @bloodchain/api build
      - name: Start API
        run: |
          node apps/api/dist/src/main.js > /tmp/api.log 2>&1 &
          echo $! > /tmp/api.pid
          for i in $(seq 1 60); do
            if curl -sf http://localhost:3001/api/v1/health > /dev/null; then
              echo "API up after ${i}s"
              exit 0
            fi
            sleep 1
          done
          echo "API did not become healthy. Log follows:"
          cat /tmp/api.log
          exit 1

      # The four-step sequence, in this order and with no reset between them.
      # Running them in any other order, or needing a reset, is the regression.
      - name: verify:safety (1 of 2)
        run: pnpm verify:safety
      - name: demo:verify (1 of 2)
        run: pnpm demo:verify
      - name: verify:safety (2 of 2, no reset in between)
        run: pnpm verify:safety
      - name: demo:verify (2 of 2, no reset in between)
        run: pnpm demo:verify

      - name: verify:geography
        run: pnpm verify:geography
      - name: verify:booleans
        run: pnpm verify:booleans

      - name: API log on failure
        if: failure()
        run: tail -200 /tmp/api.log
      - name: Stop API
        if: always()
        run: kill "$(cat /tmp/api.pid)" 2>/dev/null || true

  e2e-isolation:
    # Proves the e2e suite does not depend on state it does not own, by putting
    # the shared donor inside a recovery window first and then running the whole
    # suite twice against it. Runs the suite twice, so it is slower than
    # `test-e2e` and deliberately does not gate the fast signal.
    name: e2e isolation (suite runs twice)
    runs-on: ubuntu-latest
    needs: [test-e2e]
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: donor
          POSTGRES_PASSWORD: donor
          POSTGRES_DB: bloodchain_ci_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U donor -d bloodchain_ci_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://donor:donor@localhost:5432/bloodchain_ci_test
      JWT_ACCESS_SECRET: ci-only-access-secret-at-least-32-characters-long
      JWT_REFRESH_SECRET: ci-only-refresh-secret-at-least-32-characters-long
      NODE_ENV: test
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Generate Prisma client
        run: pnpm --filter @bloodchain/api prisma:generate
      - name: Apply migrations
        run: pnpm --filter @bloodchain/api exec prisma migrate deploy
      - name: Seed database
        run: pnpm --filter @bloodchain/api prisma:seed
      - run: pnpm verify:e2e-isolation

  verify-migrations:
    # Rehearses the two migration paths that actually happen: a clean install
    # from empty, and the newest migration applied to a database that already
    # holds rows.
    #
    # The second is the one that breaks a deployment, and none of the ways it
    # breaks -- an ADD COLUMN NOT NULL with no default, a unique index over a
    # column that already has duplicates, an ALTER TYPE that uses its own new
    # value -- fails on an empty database. Sprint 10 added the rehearsal and
    # left it to be run by hand, which is the same shape as the bug this
    # workflow's own branch list once had: a safety net nothing exercises.
    #
    # Seeded first, deliberately: the script refuses to report success against
    # an empty source, because migrating nothing proves nothing.
    name: Migration rehearsal (clean install + populated upgrade)
    runs-on: ubuntu-latest
    needs: [test-e2e]
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: donor
          POSTGRES_PASSWORD: donor
          POSTGRES_DB: bloodchain_ci_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U donor -d bloodchain_ci_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://donor:donor@localhost:5432/bloodchain_ci_test
      JWT_ACCESS_SECRET: ci-only-access-secret-at-least-32-characters-long
      JWT_REFRESH_SECRET: ci-only-refresh-secret-at-least-32-characters-long
      NODE_ENV: test
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Generate Prisma client
        run: pnpm --filter @bloodchain/api prisma:generate
      - name: Apply migrations
        run: pnpm --filter @bloodchain/api exec prisma migrate deploy
      - name: Seed database
        run: pnpm --filter @bloodchain/api prisma:seed
      - run: pnpm verify:migrations

  build:
    name: Build all apps
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Generate Prisma client
        run: pnpm --filter @bloodchain/api prisma:generate
      - run: pnpm build

  mobile-release-readiness:
    name: Mobile release readiness (SDK 56)
    runs-on: ubuntu-latest
    # Deliberately needs no secrets, no Expo account, no Apple or Google
    # credentials, and no Android SDK. Everything here is reproducible by
    # anyone who can clone the repository.
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # One React in the bundle. The mobile app is on React 19 while the three
      # Next.js consoles are still on 18, so any dependency that resolves
      # React from pnpm's hoisted copy gets the wrong one -- which React 19
      # rejects at render with "A React Element from an older version of React
      # was rendered". This found it in expo-modules-core during the SDK 53
      # upgrade, where it affected every Expo native view.
      - name: One React across the mobile dependency graph
        run: pnpm verify:single-react

      # targetSdkVersion 36, the identifiers a release build cannot be made
      # without, and the permission decisions -- resolved from the same files
      # Gradle reads, because `android/` is generated and not committed.
      - name: Android release configuration
        run: pnpm verify:android-release

      - name: Expo doctor
        # Three of its checks need api.expo.dev or reactnative.directory. Both
        # are reachable from GitHub's runners but not from every environment
        # this repository is worked on in, so a failure here is reported and
        # read rather than taken as a build break. The checks that matter for
        # an upgrade -- package versions against the SDK, duplicate
        # dependencies, React Navigation alongside expo-router -- are offline
        # and are covered by the steps above and below.
        continue-on-error: true
        run: pnpm --filter @bloodchain/mobile exec expo-doctor

      - name: Typecheck and lint the mobile app
        run: |
          pnpm --filter @bloodchain/mobile typecheck
          pnpm --filter @bloodchain/mobile lint

      # `--runInBand` on purpose, and not for speed.
      #
      # With workers, jest force-kills them at the end of the run, so a leaked
      # ref'd timer or a tree still rendering leaves nothing but a "worker
      # process has failed to exit gracefully" warning that reads as noise. In
      # band, the leak lands in the main process and jest refuses to exit --
      # which is how a mutation gc timer surfaced here as a job that passed all
      # 263 tests and then sat for another four and three quarter minutes.
      # A two-core runner gives maxWorkers=1 anyway; saying so makes the
      # guarantee independent of how many cores the runner happens to have.
      - name: Mobile test suite (in band, so a leaked handle fails the job)
        run: pnpm --filter @bloodchain/mobile exec jest --runInBand

      # The real proof that the app still builds: Metro resolves and bundles
      # every module and Hermes compiles it, exactly as a release build does.
      # A typecheck cannot catch a module that fails to resolve at runtime;
      # this does.
      - name: Production JS bundle (Android)
        run: pnpm --filter @bloodchain/mobile exec expo export --platform android --output-dir .expo-export-ci
      - name: Production JS bundle (iOS)
        run: pnpm --filter @bloodchain/mobile exec expo export --platform ios --output-dir .expo-export-ci-ios

      # Native project generation. This does not compile anything -- it proves
      # app.json still produces a valid Android and iOS project, which is what
      # a CNG build starts from.
      - name: Native project generation (prebuild)
        run: pnpm --filter @bloodchain/mobile exec expo prebuild --platform all --no-install --clean

      - name: The generated manifest carries only the permissions we justify
        run: |
          echo "--- Android permissions ---"
          grep -E 'uses-permission' apps/mobile/android/app/src/main/AndroidManifest.xml
          echo "--- iOS usage descriptions ---"
          grep -A1 'UsageDescription' apps/mobile/ios/Bloodchain/Info.plist
          echo "--- targetSdkVersion wiring ---"
          grep -n 'targetSdkVersion' apps/mobile/android/app/build.gradle
