name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch: {}

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: '22'

jobs:
  lint-and-typecheck:
    name: Lint & typecheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Generate Prisma client
        run: pnpm --filter @bloodchain/api prisma:generate
      - run: pnpm typecheck
      - run: pnpm lint

  test:
    name: Unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Generate Prisma client
        run: pnpm --filter @bloodchain/api prisma:generate
      - run: pnpm test

  test-e2e:
    name: API e2e tests (real database)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: donor
          POSTGRES_PASSWORD: donor
          POSTGRES_DB: donor_e2e
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U donor -d donor_e2e"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://donor:donor@localhost:5432/donor_e2e
      JWT_ACCESS_SECRET: ci-e2e-access-secret-at-least-32-characters-long
      JWT_REFRESH_SECRET: ci-e2e-refresh-secret-at-least-32-characters-long
      NODE_ENV: test
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Generate Prisma client
        run: pnpm --filter @bloodchain/api prisma:generate
      - name: Apply migrations
        run: pnpm --filter @bloodchain/api exec prisma migrate deploy
      - name: Seed database (roles/permissions the app requires to function, e.g. register needs the DONOR role to exist)
        run: pnpm --filter @bloodchain/api prisma:seed
      - run: pnpm --filter @bloodchain/api test:e2e

  build:
    name: Build all apps
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Generate Prisma client
        run: pnpm --filter @bloodchain/api prisma:generate
      - run: pnpm build
