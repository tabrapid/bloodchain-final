# Install in nginx's http context, e.g. /etc/nginx/conf.d/.
# Each BloodChain server block must select this format explicitly:
# access_log /var/log/nginx/bloodchain-access.log bloodchain_privacy;
# Do not add $request, $args, referer, cookies or authorization headers.
log_format bloodchain_privacy escape=json
 '{"time":"$time_iso8601","client":"$remote_addr","method":"$request_method","path":"$uri","status":$status,"bytes":$body_bytes_sent,"requestId":"$request_id"}';
