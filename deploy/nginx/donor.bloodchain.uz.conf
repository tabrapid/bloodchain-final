# Managed by BloodChain donor deployment.
# Install after the donor service is healthy. Certbot adds TLS and HTTPS redirect.
server {
    listen 80;
    server_name donor.bloodchain.uz;
    server_tokens off;
    client_max_body_size 1m;
    # No query strings, reset tokens, cookies or auth headers in access logs.
    access_log /var/log/nginx/bloodchain-donor-access.log bloodchain_privacy;
    add_header Referrer-Policy "no-referrer" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    location / {
        proxy_pass http://127.0.0.1:3005;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 5s;
        proxy_read_timeout 40s;
        proxy_hide_header X-Powered-By;
    }
}
